name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        system:
          - x86_64-linux
          - aarch64-linux
    runs-on: ${{ matrix.system == 'aarch64-linux' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Enable Nix binary cache
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          use-flakehub: disabled

      - name: Validate flake structure
        run: nix flake show --no-write-lock-file

      - name: Build package
        run: nix build ".#packages.${{ matrix.system }}.helium" --no-link --no-write-lock-file

      - name: Run Helium runtime smoke test
        run: nix build ".#checks.${{ matrix.system }}.runtime-smoke" --no-link --no-write-lock-file

      - name: Evaluate NixOS module
        run: nix build ".#checks.${{ matrix.system }}.nixos-module" --no-link --no-write-lock-file

      - name: Evaluate Home Manager module
        run: nix build ".#checks.${{ matrix.system }}.home-manager-module" --no-link --no-write-lock-file
